# ELI v3 — cross-platform release pipeline.
#
# Trigger: push a tag `v<version>` (must match [project].version in
# pyproject.toml — the guard job fails the run with a clear message if not).
#
#   git tag v2.1.0 && git push origin v2.1.0
#
# Builds in parallel and uploads to the GitHub Release for that tag:
#   Windows : ELI-Setup-<v>.exe (Inno Setup) + ELI_v3-<v>-windows-x64.zip (portable, ELI.exe inside)
#   WoA     : ELI_v3-<v>-windows-arm64-portable.zip (lean, experimental — cross-built on ubuntu)
#   macOS   : ELI_v3-<v>-macos-arm64.dmg (drag-to-Applications, ad-hoc signed)
#   Linux   : ELI_v3.0-<v>-x86_64.AppImage + ELI_v3.0-<v>-linux-portable.tar.gz
#             + ELI_v3-<v>-gpl-sources.tar.gz (source of the GPL packages every build carries)
#   Source  : eli_v3-<v>.whl + sdist .tar.gz + .deb + windows-portable.zip
#             + windows-portable-full.zip + wheelhouse(-arm64).tar.gz + WHEELHOUSE(-arm64).txt
# plus SHA256SUMS.txt + RELEASE_NOTES.md.
#
# The Kokoro voice IS bundled (ELI's fetcher pulls its files at pinned revisions,
# checksum-checked, into tts_kokoro/). GGUF model weights are runtime downloads
# (too big to bundle). Binaries are unsigned; see
# docs/RELEASE_PIPELINE.md for optional Windows/Apple signing steps.
#
# Linux jobs run on ubuntu-24.04 by name, never ubuntu-latest. The build machine's
# glibc is the oldest the download starts on (24.04 = glibc 2.39). When GitHub moves
# "latest" to a newer Ubuntu the AppImage would stop starting on today's systems.
# GPU packs load into this app and must be built on the same image. To move it:
# this workflow, LINUX_GLIBC_FLOOR, docs/CROSS_PLATFORM.md
# (tests/test_linux_build_baseline.py checks they agree).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual dry-run: builds artifacts, skips the Release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 3.12+: None can't be freed, so an extension can't abort the app that way (PySide6 6.12.0 on 3.11 did)
  PYTHON_VERSION: "3.12"
  # glibc of the build image. The Linux job fails if the bundle needs newer.
  LINUX_GLIBC_FLOOR: "2.39"
  # Every pip install in every job is held to the llama-cpp-python the GPU packs are
  # built at. Unpinned, pip takes the newest upstream and the app crashes on launch
  # wherever a pack of another version is installed. See the file itself.
  # And to the lock the installers use: without it the bundle took the newest of everything,
  # PyAV 18 among them, which refuses an argument faster-whisper 1.2.1 passes, and every
  # transcription in the packaged app failed. The lock is read through
  # packaging/lock_constraints.py, which leaves out a pin the build's own tools do not allow
  # (setuptools); each job that runs pip writes it first. Space-separated: pip reads both.
  # Absolute: a wheel is built from a clean export of the committed tree in another folder, where
  # the generated file (not committed) is not, and a relative path found nothing.
  PIP_CONSTRAINT: ${{github.workspace}}/packaging/llama_cpp_constraints.txt ${{github.workspace}}/.build-constraints/lock.txt
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  # Everything ELI needs to run its features is in pyproject's dependencies, which every install
  # below brings (it fails if one of them cannot be installed). The extras are what is built for, or
  # chosen by, the machine's GPU.
  # Extras that MUST be in the frozen app; the build fails if any is missing.
  REQUIRED_EXTRAS: "llm"
  # Extras bundled when their wheels resolve on the runner; skipped (loudly)
  # otherwise — every optional import in ELI degrades cleanly by design.
  # NOTE: this list is consumed by ALL THREE build jobs. No neural voice engine is in it: an extra
  # that brings torch makes windows/macos resolve it from PyPI, and their bundles then fail the
  # 2 GiB asset guard below.
  OPTIONAL_EXTRAS: "image"

jobs:
  guard:
    name: version guard
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Whole-tree syntax gate at the BUILD python version
        # The v2.1.0 exe shipped broken because one file used py3.12-only
        # f-string syntax while builds run py3.11: PyInstaller only WARNS on
        # uncompilable modules. Fail the release up front instead.
        run: |
          python -m compileall -q eli api || {
            echo "::error::source does not compile under the release Python ($PYTHON_VERSION) — fix the file above (requires-python is >=3.10, so no 3.12-only syntax)"
            exit 1
          }
      - name: Read version from pyproject.toml and check the tag matches
        id: ver
        run: |
          VERSION=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" != "v$VERSION" ]]; then
              echo "::error::Tag '$TAG' does not match pyproject.toml version '$VERSION'. Bump [project].version (and eli/kernel/self_upgrade.py + tests/test_pyproject_packaging.py) or re-tag as v$VERSION."
              exit 1
            fi
          fi

  build-windows:
    env:
      ELI_REQUIRE_VOICES: "1"
      ELI_REQUIRE_EMBEDDER: "1"
      GH_TOKEN: ${{ github.token }}
    name: windows (exe + installer)
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Constraints from the lock (pip reads them through PIP_CONSTRAINT)
        shell: bash
        run: python packaging/lock_constraints.py .build-constraints/lock.txt

      - name: Set SOURCE_DATE_EPOCH (reproducible timestamps)
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install dependencies (core hard-fails; optional extras degrade loudly)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          pip install -r requirements-build.txt
          llama_src="$(python packaging/llama_source.py)"
          pip install "$llama_src"
          pip install ".[$(echo $REQUIRED_EXTRAS | tr ' ' ',')]"
          for extra in $OPTIONAL_EXTRAS; do
            pip install ".[$extra]" \
              || echo "::warning::optional extra '$extra' has no installable wheels on windows — shipped build degrades cleanly without it"
          done

      - name: Leave out the GPL packages PyAutoGUI declares (ELI runs without them; ELI.spec stops on any GPL package)
        shell: bash
        run: python packaging/gpl_sources.py --leave-out

      - name: Generate capability manifests (bundled introspection data)
        shell: bash
        run: |
          python -m eli.core.init_data
          python tools/bootstrap_claims_artifacts.py

      - name: Bundle the Kokoro voice (fetched pinned and checksum-checked by ELI's own fetcher)
        shell: bash
        run: |
          # Hugging Face and GitHub occasionally 5xx mid-release; retry with backoff (files already
          # fetched and checked are kept, so a retry fetches only what is missing).
          _voice_ok=0
          for _attempt in 1 2 3 4 5; do
            if python -m eli.runtime.voice_assets --kokoro-to tts_kokoro; then
              _voice_ok=1
              break
            fi
            echo "::warning::voice asset download attempt ${_attempt}/5 failed — retrying in $((_attempt * 5))s"
            sleep $((_attempt * 5))
          done
          [ "$_voice_ok" -eq 1 ] || { echo "::error::could not fetch the Kokoro voice after 5 attempts"; exit 1; }
          count=$(ls tts_kokoro/voices/*.bin 2>/dev/null | wc -l)
          echo "Kokoro voices fetched: $count"
          [ -f tts_kokoro/model.onnx ] && [ "$count" -ge 1 ] || { echo "::error::the Kokoro model or its voices are missing after the fetch"; exit 1; }

      - name: Bundle text embedder (nomic-embed, required for memory/RAG)
        shell: bash
        run: |
          # Ship the ~84 MB embedder so the packaged app has semantic memory
          # offline instead of degrading to keyword-only recall. Download straight
          # to the repo-relative path ELI.spec bundles from — NOT via model_download,
          # whose models_dir() resolves to a runtime data dir that differs per OS.
          set -euo pipefail
          dest="models/embeddings/nomic-embed-text-v1.5.Q4_K_M.gguf"
          url="https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf"
          mkdir -p models/embeddings
          curl -fL --retry 3 --retry-delay 5 -o "$dest" "$url" \
            || { echo "::error::embedder download failed from $url"; exit 1; }
          # Guard against an HTML error page saved as the .gguf (size sanity: >50 MB).
          bytes=$(wc -c < "$dest")
          [ "$bytes" -gt 52428800 ] \
            || { echo "::error::embedder is only $bytes bytes — download did not return the model"; exit 1; }
          echo "embedder: $(( bytes / 1048576 )) MiB at $dest"

      - name: PyInstaller build (ELI.spec)
        shell: bash
        run: pyinstaller --noconfirm --clean ELI.spec

      - name: Nothing in the bundle a closed, paid product may not pass on (GPL libraries, non-commercial models)
        shell: bash
        run: python packaging/gpl_sources.py --check-bundle dist/ELI

      - name: Smoke check — bundle structure + REAL launch selftest
        shell: bash
        run: |
          test -f dist/ELI/ELI.exe || { echo "::error::dist/ELI/ELI.exe missing"; exit 1; }
          test -f dist/ELI/ELI-Server.exe || { echo "::error::dist/ELI/ELI-Server.exe missing"; exit 1; }
          test -d dist/ELI/_internal/eli || { echo "::error::eli source tree missing from bundle"; exit 1; }
          test -f dist/ELI/_internal/config/settings.example.json || { echo "::error::config seeds missing from bundle"; exit 1; }
          # Boot the frozen app's import stack for real — catches missing
          # hidden imports / syntax errors that only appear at runtime.
          if ! ./dist/ELI/ELI.exe --selftest; then
            echo "::error::frozen app failed its launch selftest:"
            cat eli_selftest_error.log 2>/dev/null || true
            exit 1
          fi

      - name: Reclaim disk before packaging
        shell: bash
        run: rm -rf build/ELI tts_kokoro

      - name: Portable zip
        shell: bash
        run: |
          V=${{ needs.guard.outputs.version }}
          7z a -tzip "dist/ELI_v3-$V-windows-x64.zip" ./dist/ELI

      - name: Download VC++ redistributable (bundled into installer)
        shell: bash
        run: |
          mkdir -p build
          # aka.ms is a redirect to a Microsoft CDN that occasionally 5xx/times out —
          # retry so a transient hiccup can't fail an otherwise-green release (it did
          # once, skipping publish while Linux/macOS built fine).
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
            -o build/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          test -s build/vc_redist.x64.exe || { echo "::error::vc_redist download failed after retries"; exit 1; }

      - name: Inno Setup installer
        shell: pwsh
        run: |
          # The licence pane reads a generated UTF-8+BOM copy of LICENSE; Inno
          # decodes a BOM-less UTF-8 file as ANSI and mangles it.
          python scripts\make_installer_license.py
          if ($LASTEXITCODE -ne 0) { Write-Error "could not generate the installer licence file"; exit 1 }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup 6 (ISCC.exe) not found and choco install failed"; exit 1 }
          & $iscc packaging\windows\installer.iss /DMyAppVersion=${{ needs.guard.outputs.version }}
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with exit code $LASTEXITCODE"; exit 1 }

      - name: Checksums + GitHub 2 GiB asset-size guard
        shell: bash
        run: |
          cd dist
          rm -rf ELI
          for f in *.zip *.exe; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS-windows.txt
            size=$(stat -c%s "$f")
            if [ "$size" -ge 2147483648 ]; then
              echo "::error::$f is $size bytes — over GitHub's 2 GiB release-asset limit. Trim OPTIONAL_EXTRAS in release.yml."
              exit 1
            fi
          done
          cat SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: eli-windows
          retention-days: 3   # build intermediates; the publish job consumes them immediately
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  build-macos:
    env:
      ELI_REQUIRE_VOICES: "1"
      ELI_REQUIRE_EMBEDDER: "1"
      GH_TOKEN: ${{ github.token }}
    name: macos (app + dmg, arm64)
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Constraints from the lock (pip reads them through PIP_CONSTRAINT)
        shell: bash
        run: python packaging/lock_constraints.py .build-constraints/lock.txt

      - name: Set SOURCE_DATE_EPOCH (reproducible timestamps)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: System build deps (portaudio for PyAudio)
        run: brew install portaudio

      - name: Install dependencies (core hard-fails; optional extras degrade loudly)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          pip install -r requirements-build.txt
          llama_src="$(python packaging/llama_source.py)"
          pip install "$llama_src"
          pip install ".[$(echo $REQUIRED_EXTRAS | tr ' ' ',')]"
          for extra in $OPTIONAL_EXTRAS; do
            pip install ".[$extra]" \
              || echo "::warning::optional extra '$extra' has no installable wheels on macos-arm64 — shipped build degrades cleanly without it"
          done

      - name: Leave out the GPL packages PyAutoGUI declares (ELI runs without them; ELI.spec stops on any GPL package)
        shell: bash
        run: python packaging/gpl_sources.py --leave-out

      - name: Generate capability manifests (bundled introspection data)
        run: |
          python -m eli.core.init_data
          python tools/bootstrap_claims_artifacts.py

      - name: Bundle the Kokoro voice (fetched pinned and checksum-checked by ELI's own fetcher)
        run: |
          # Hugging Face and GitHub occasionally 5xx mid-release; retry with backoff (files already
          # fetched and checked are kept, so a retry fetches only what is missing).
          _voice_ok=0
          for _attempt in 1 2 3 4 5; do
            if python -m eli.runtime.voice_assets --kokoro-to tts_kokoro; then
              _voice_ok=1
              break
            fi
            echo "::warning::voice asset download attempt ${_attempt}/5 failed — retrying in $((_attempt * 5))s"
            sleep $((_attempt * 5))
          done
          [ "$_voice_ok" -eq 1 ] || { echo "::error::could not fetch the Kokoro voice after 5 attempts"; exit 1; }
          count=$(ls tts_kokoro/voices/*.bin 2>/dev/null | wc -l)
          echo "Kokoro voices fetched: $count"
          [ -f tts_kokoro/model.onnx ] && [ "$count" -ge 1 ] || { echo "::error::the Kokoro model or its voices are missing after the fetch"; exit 1; }

      - name: Bundle text embedder (nomic-embed, required for memory/RAG)
        shell: bash
        run: |
          # Ship the ~84 MB embedder so the packaged app has semantic memory
          # offline instead of degrading to keyword-only recall. Download straight
          # to the repo-relative path ELI.spec bundles from — NOT via model_download,
          # whose models_dir() resolves to a runtime data dir that differs per OS.
          set -euo pipefail
          dest="models/embeddings/nomic-embed-text-v1.5.Q4_K_M.gguf"
          url="https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf"
          mkdir -p models/embeddings
          curl -fL --retry 3 --retry-delay 5 -o "$dest" "$url" \
            || { echo "::error::embedder download failed from $url"; exit 1; }
          bytes=$(wc -c < "$dest")
          [ "$bytes" -gt 52428800 ] \
            || { echo "::error::embedder is only $bytes bytes — download did not return the model"; exit 1; }
          echo "embedder: $(( bytes / 1048576 )) MiB at $dest"

      - name: PyInstaller build (ELI.spec)
        run: pyinstaller --noconfirm --clean ELI.spec

      - name: Nothing in the bundle a closed, paid product may not pass on (GPL libraries, non-commercial models)
        shell: bash
        run: python packaging/gpl_sources.py --check-bundle dist/ELI.app

      - name: Smoke check — .app structure + REAL launch selftest
        run: |
          test -x dist/ELI.app/Contents/MacOS/ELI || { echo "::error::ELI.app executable missing"; exit 1; }
          test -d dist/ELI.app/Contents/Frameworks/eli -o -d dist/ELI.app/Contents/Resources/eli || { echo "::error::eli source tree missing from .app"; exit 1; }
          if ! ./dist/ELI.app/Contents/MacOS/ELI --selftest; then
            echo "::error::frozen app failed its launch selftest:"
            cat eli_selftest_error.log 2>/dev/null || true
            exit 1
          fi

      - name: Build .dmg (ad-hoc signed)
        run: bash packaging/macos/build-dmg.sh

      - name: Checksums + GitHub 2 GiB asset-size guard
        run: |
          cd dist
          rm -rf ELI ELI.app
          for f in *.dmg; do
            shasum -a 256 "$f" >> SHA256SUMS-macos.txt
            size=$(stat -f%z "$f")
            if [ "$size" -ge 2147483648 ]; then
              echo "::error::$f is $size bytes — over GitHub's 2 GiB release-asset limit. Trim OPTIONAL_EXTRAS in release.yml."
              exit 1
            fi
          done
          cat SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: eli-macos
          retention-days: 3   # build intermediates; the publish job consumes them immediately
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error

  build-linux:
    env:
      ELI_REQUIRE_VOICES: "1"
      ELI_REQUIRE_EMBEDDER: "1"
      GH_TOKEN: ${{ github.token }}
      # No neural voice engine is bundled. Qwen3-TTS (Apache-2.0) is made into a runtime of its own on a
      # machine whose GPU has room for it (eli/perception/qwen3_runtime.py). Coqui XTTS-v2 (its model is
      # non-commercial) and Chatterbox (it brings pykakasi, GPL-3.0) are no engines of v3 any more.
    name: linux (AppImage)
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Constraints from the lock (pip reads them through PIP_CONSTRAINT)
        shell: bash
        run: python packaging/lock_constraints.py .build-constraints/lock.txt

      - name: Set SOURCE_DATE_EPOCH (reproducible timestamps)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Free runner disk (full dependency stack + staging needs it)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: System build deps (portaudio, Qt/GL runtime libs)
        run: |
          sudo apt-get update
          # xcb-util family: Qt 6.5+'s xcb platform plugin (libqxcb.so) links the
          #   whole set at runtime (libxcb-cursor/icccm/image/keysyms/render-util/util).
          #   PyInstaller only bundles what is present at build time, so these MUST be
          #   installed or the AppImage fails on lean end-user distros — Qt reports it
          #   misleadingly as "libxcb-cursor0 is needed" whichever member is missing.
          # xvfb: virtual X server for the real-xcb GUI selftest in the smoke check.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-util1 libxcb-shape0 libxcb-randr0 libxcb-render0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxkbcommon0 xvfb

      - name: PortAudio without JACK (Ubuntu's links JACK, and JACK links Berkeley DB, under the Sleepycat licence)
        run: |
          set -euo pipefail
          # PyAudio is compiled against PortAudio here, and PyInstaller bundles the PortAudio it links.
          # Ubuntu's libportaudio2 is built with JACK, whose libjack links Berkeley DB 5.3: under the
          # Sleepycat licence the source of every program using it has to be offered, so the AppImage could
          # not carry it. ALSA alone reaches the sound server (PulseAudio, PipeWire) through ALSA's plug-ins.
          src=pa_stable_v190700_20210406.tgz
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/$src" "https://files.portaudio.com/archives/$src"
          # 1,462,695 bytes; this sha256 was checked against the archive files.portaudio.com serves (2026-11-23)
          echo "47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def  $RUNNER_TEMP/$src" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$src" -C "$RUNNER_TEMP"
          ( cd "$RUNNER_TEMP/portaudio" && ./configure --prefix=/usr/local --with-alsa --without-jack --without-oss \
              --disable-static && make -j"$(nproc)" && sudo make install )
          sudo ldconfig
          if ldd /usr/local/lib/libportaudio.so.2 | grep -i -E 'jack|libdb'; then
            echo "::error::the PortAudio built here still links JACK or Berkeley DB"; exit 1
          fi

      - name: Install dependencies (core hard-fails; optional extras degrade loudly)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          pip install -r requirements-build.txt
          # CPU torch stack FIRST — default PyPI torch drags ~6 GB of CUDA libs into the
          # bundle. torchaudio is included here for the same reason: a package that asks for it
          # and resolves it from PyPI afterwards pulls the CUDA build of torch straight back in.
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # an extra that pins its own torch gets the CPU build of it too
          export PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu
          llama_src="$(python packaging/llama_source.py)"
          pip install "$llama_src"
          pip install ".[$(echo $REQUIRED_EXTRAS | tr ' ' ',')]"
          for extra in $OPTIONAL_EXTRAS; do
            pip install ".[$extra]" \
              || echo "::warning::optional extra '$extra' has no installable wheels on linux — shipped build degrades cleanly without it"
          done
          # An extra that quietly re-resolved torch from PyPI would pull the CUDA build
          # (~6 GB of nvidia-* wheels) and push the AppImage past GitHub's 2 GB per-asset
          # limit — the exact failure that kept `natural` out of the bundle before. Fail
          # here, where the cause is obvious, rather than at upload.
          # the whole list is read first: grep -q quit at the first match, pip died on the
          # closed pipe and pipefail turned the test false, so 4 GB of CUDA went through
          cuda="$(pip list --format=freeze | grep -E '^(nvidia-|triton=)' || true)"
          if [ -n "$cuda" ]; then
            echo "::error::CUDA wheels were pulled in — the torch stack is no longer CPU-only:"
            echo "$cuda" | sed 's/^/  /'
            exit 1
          fi

      - name: Leave out the GPL packages PyAutoGUI declares (ELI runs without them; ELI.spec stops on any GPL package)
        shell: bash
        run: python packaging/gpl_sources.py --leave-out

      - name: Generate capability manifests (bundled introspection data)
        run: |
          python -m eli.core.init_data
          python tools/bootstrap_claims_artifacts.py

      - name: Bundle the Kokoro voice (fetched pinned and checksum-checked by ELI's own fetcher)
        run: |
          # Hugging Face and GitHub occasionally 5xx mid-release; retry with backoff (files already
          # fetched and checked are kept, so a retry fetches only what is missing).
          _voice_ok=0
          for _attempt in 1 2 3 4 5; do
            if python -m eli.runtime.voice_assets --kokoro-to tts_kokoro; then
              _voice_ok=1
              break
            fi
            echo "::warning::voice asset download attempt ${_attempt}/5 failed — retrying in $((_attempt * 5))s"
            sleep $((_attempt * 5))
          done
          [ "$_voice_ok" -eq 1 ] || { echo "::error::could not fetch the Kokoro voice after 5 attempts"; exit 1; }
          count=$(ls tts_kokoro/voices/*.bin 2>/dev/null | wc -l)
          echo "Kokoro voices fetched: $count"
          [ -f tts_kokoro/model.onnx ] && [ "$count" -ge 1 ] || { echo "::error::the Kokoro model or its voices are missing after the fetch"; exit 1; }

      - name: Bundle GPU acceleration packs (offline-first CUDA/Vulkan)
        run: |
          mkdir -p gpu-packs
          _gpu_ok=0
          for _attempt in 1 2 3 4 5; do
            if gh release download gpu-packs --repo "$GITHUB_REPOSITORY" --clobber \
                --pattern "vulkan-*linux_x86_64*.whl" \
                --pattern "cuda-*linux_x86_64*.whl" \
                --dir gpu-packs; then
              _gpu_ok=1
              break
            fi
            echo "::warning::gpu-packs download attempt ${_attempt}/5 failed — retrying"
            sleep $((_attempt * 5))
          done
          if [ "$_gpu_ok" -eq 1 ]; then
            ls -lh gpu-packs/
          else
            echo "::warning::gpu-packs unavailable — AppImage will download GPU pack at first launch"
          fi

      - name: Bundle text embedder (nomic-embed, required for memory/RAG)
        shell: bash
        run: |
          # Ship the ~84 MB embedder so the packaged app has semantic memory
          # offline instead of degrading to keyword-only recall. Download straight
          # to the repo-relative path ELI.spec bundles from — NOT via model_download,
          # whose models_dir() resolves to a runtime data dir that differs per OS.
          set -euo pipefail
          dest="models/embeddings/nomic-embed-text-v1.5.Q4_K_M.gguf"
          url="https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf"
          mkdir -p models/embeddings
          curl -fL --retry 3 --retry-delay 5 -o "$dest" "$url" \
            || { echo "::error::embedder download failed from $url"; exit 1; }
          bytes=$(wc -c < "$dest")
          [ "$bytes" -gt 52428800 ] \
            || { echo "::error::embedder is only $bytes bytes — download did not return the model"; exit 1; }
          echo "embedder: $(( bytes / 1048576 )) MiB at $dest"

      - name: PyInstaller build (ELI.spec)
        run: |
          pyinstaller --noconfirm --clean ELI.spec

      - name: No GTK or GLib I/O library in the bundle (they would load the user's system's plug-ins)
        run: |
          python packaging/linux/trim_bundle.py dist/ELI/_internal
          python packaging/linux/trim_bundle.py --check dist/ELI/_internal

      - name: Nothing in the bundle a closed, paid product may not pass on (GPL libraries, non-commercial models)
        shell: bash
        run: python packaging/gpl_sources.py --check-bundle dist/ELI

      - name: Smoke check — bundle structure + REAL launch selftest (headless + xcb)
        run: |
          test -x dist/ELI/ELI || { echo "::error::dist/ELI/ELI missing"; exit 1; }
          test -x dist/ELI/ELI-Server || { echo "::error::dist/ELI/ELI-Server missing"; exit 1; }
          test -d dist/ELI/_internal/eli || { echo "::error::eli source tree missing from bundle"; exit 1; }
          # Self-containment guard: the Qt xcb plugin (libqxcb.so) links the whole
          # xcb-util family at runtime and resolves them via its RUNPATH from
          # PySide6/Qt/lib. Assert EACH member is bundled IN THAT EXACT DIRECTORY —
          # v2.1.20 bundled libxcb-cursor into the bundle root instead, which the
          # plugin never searches, so the GUI still failed on lean distros. Checking
          # the precise dir (not just "present somewhere") is what closes that gap.
          # The list is what the bundled plugin links (readelf), not a list kept by hand.
          QTLIBDIR=dist/ELI/_internal/PySide6/Qt/lib
          _needed=$(readelf -d dist/ELI/_internal/PySide6/Qt/plugins/platforms/libqxcb.so "$QTLIBDIR/libQt6XcbQpa.so.6" \
                    | grep -o 'Shared library: \[lib\(xcb-\|xkbcommon\)[^]]*' | sed 's/.*\[//' | sort -u)
          test -n "$_needed" || { echo "::error::could not read the xcb plugin's libraries"; exit 1; }
          for _lib in $_needed; do
            if ! ls "$QTLIBDIR/$_lib"* >/dev/null 2>&1; then
              echo "::error::$_lib is NOT bundled in $QTLIBDIR — Qt xcb GUI will fail on minimal distros"
              exit 1
            fi
          done
          # Headless engine selftest (offscreen Qt platform).
          if ! QT_QPA_PLATFORM=offscreen ./dist/ELI/ELI --selftest; then
            echo "::error::frozen app failed its headless launch selftest:"
            cat eli_selftest_error.log 2>/dev/null || true
            exit 1
          fi
          # Real-X GUI selftest under a virtual display — exercises the xcb platform
          # plugin the offscreen path never touches. THIS is the check that would have
          # caught the missing-libxcb-cursor gap; keep it so it can't regress.
          if ! xvfb-run -a env QT_QPA_PLATFORM=xcb ./dist/ELI/ELI --selftest; then
            echo "::error::frozen app failed the xcb (real X) launch selftest — a Qt GUI dependency is missing from the bundle:"
            cat eli_selftest_error.log 2>/dev/null || true
            exit 1
          fi

      - name: System library floor (the oldest glibc this bundle starts on)
        run: python packaging/linux/glibc_floor.py dist/ELI --max "$LINUX_GLIBC_FLOOR"

      - name: Build AppImage
        run: bash packaging/linux/build-appimage-pyinstaller.sh

      - name: Classic portable tarball (source + voices + offline GUI wheelhouse)
        run: |
          pip install build
          ELI_PORTABLE_WHEELHOUSE=1 SKIP_TESTS=1 bash scripts/package_desktop_app.sh --with-assets
          mv dist/app_packages/ELI_v3.0-*-linux-portable.tar.gz dist/
          ls -lh dist/*.tar.gz

      # GPL-3.0 lets the bundles carry a GPL package when its exact source goes with them; SOURCES.md
      # says so plainly when the builds carry none (PyAutoGUI's are left out above). This environment installs the extras every build does.
      # A source that cannot be fetched fails the release. Beside it,
      # LGPL_SOURCES.md says where the source of each LGPL package (Qt for Python and the Qt inside it
      # among them) is, at the version the builds carry; one it cannot find fails it too.
      - name: Source of the GPL packages the bundles carry (attached to the release)
        run: |
          python packaging/gpl_sources.py dist/gpl-sources
          cat dist/gpl-sources/SOURCES.md
          cat dist/gpl-sources/LGPL_SOURCES.md
          tar -czf "dist/ELI_v3-${{ needs.guard.outputs.version }}-gpl-sources.tar.gz" -C dist gpl-sources
          rm -rf dist/gpl-sources

      - name: Checksums + GitHub 2 GiB asset-size guard
        run: |
          cd dist
          rm -rf ELI
          for f in *.AppImage *.tar.gz; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS-linux.txt
            size=$(stat -c%s "$f")
            if [ "$size" -ge 2147483648 ]; then
              echo "::error::$f is $size bytes — over GitHub's 2 GiB release-asset limit. Trim OPTIONAL_EXTRAS in release.yml."
              exit 1
            fi
          done
          cat SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: eli-linux
          retention-days: 3   # build intermediates; the publish job consumes them immediately
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error

  build-source-artifacts:
    name: source packages (wheel, sdist, deb, wheelhouse, win-portable)
    needs: guard
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Constraints from the lock (pip reads them through PIP_CONSTRAINT)
        shell: bash
        run: python packaging/lock_constraints.py .build-constraints/lock.txt

      - name: Set SOURCE_DATE_EPOCH (reproducible timestamps)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build wheel
          sudo apt-get update
          # portaudio19-dev: PyAudio (voice input, one of ELI's dependencies) is compiled against it
          sudo apt-get install -y dpkg-dev zip portaudio19-dev

      - name: Bootstrap claims artifacts (manifest for wheel integrity)
        run: |
          pip install tomli
          pip install -e . --quiet
          python -m eli.core.init_data
          python tools/bootstrap_claims_artifacts.py

      - name: Build Python wheel + sdist
        run: python -m build --wheel --sdist --outdir dist/

      - name: Build Debian package
        run: |
          bash packaging/debian/build-deb.sh "${{ needs.guard.outputs.version }}"
          ls -lh dist/*.deb      # this build writes the .deb straight into dist/

      - name: Build Windows wheelhouse + lean/full portable zips (x64 + WoA arm64)
        env:
          SKIP_TESTS: "1"
          SKIP_COMPILE: "1"
        run: |
          bash build_packages.sh wheelhouse windows-lean windows wheelhouse-arm64 windows-arm64-lean
          if [ -d dist/wheelhouse ]; then
            tar -czf "dist/ELI_v3-${{ needs.guard.outputs.version }}-wheelhouse.tar.gz" -C dist wheelhouse
            ls -1 dist/wheelhouse > dist/WHEELHOUSE.txt
          else
            echo "::error::wheelhouse directory missing after build_packages.sh wheelhouse"
            exit 1
          fi
          if [ -d dist/wheelhouse-arm64 ]; then
            tar -czf "dist/ELI_v3-${{ needs.guard.outputs.version }}-wheelhouse-arm64.tar.gz" -C dist wheelhouse-arm64
            ls -1 dist/wheelhouse-arm64 > dist/WHEELHOUSE-arm64.txt
          else
            echo "::warning::wheelhouse-arm64 directory missing — WoA offline install may be incomplete"
          fi
          test -f "dist/ELI_v3-${{ needs.guard.outputs.version }}-windows-portable.zip" \
            || { echo "::error::windows lean portable zip missing"; exit 1; }
          test -f "dist/ELI_v3-${{ needs.guard.outputs.version }}-windows-portable-full.zip" \
            || { echo "::error::windows full offline portable zip missing"; exit 1; }
          test -f "dist/ELI_v3-${{ needs.guard.outputs.version }}-windows-arm64-portable.zip" \
            || { echo "::error::windows-arm64 lean portable zip missing"; exit 1; }

      - name: Write release notes stub
        run: |
          V=${{ needs.guard.outputs.version }}
          cat > dist/RELEASE_NOTES.md <<EOF
          # ELI v3 ${V}

          Full release: frozen bundles (AppImage / dmg / exe) plus pip-installable wheel,
          source tarball, Debian package, Windows lean portable (source + wheel),
          Windows on ARM (WoA) lean portable (experimental), and offline Windows wheelhouse
          archives (x64 + arm64). GPU acceleration packs refresh on the \`gpu-packs\`
          pre-release when this tag is pushed.

          Linux: the AppImage needs glibc ${LINUX_GLIBC_FLOOR} or newer (check with
          \`ldd --version\`; docs/CROSS_PLATFORM.md lists which distributions that is).
          On an older system use the linux-portable package, which installs from source.

          Third-party source: any package under the GPL the builds carry (THIRD_PARTY_NOTICES.md
          names them; SOURCES.md says when there is none). Their exact
          source, at the versions these builds carry, is attached here as
          \`ELI_v3-${V}-gpl-sources.tar.gz\`; the SOURCES.md inside lists each file and where it came from.
          The packages under the LGPL (Qt for Python and the Qt libraries inside it, zeroconf,
          python-xlib and the others it names) are not attached: LGPL_SOURCES.md, in the same archive,
          gives each one's version and the address of that version's source.

          Verify: \`sha256sum -c SHA256SUMS.txt\`
          EOF

      - name: Checksums + GitHub 2 GiB asset-size guard
        run: |
          cd dist
          for f in *.whl *.deb *.zip *wheelhouse*.tar.gz eli_v3-*.tar.gz RELEASE_NOTES.md WHEELHOUSE*.txt; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS-source.txt
            size=$(stat -c%s "$f")
            if [ "$size" -ge 2147483648 ]; then
              echo "::error::$f is $size bytes — over GitHub's 2 GiB release-asset limit."
              exit 1
            fi
          done
          cat SHA256SUMS-source.txt

      - uses: actions/upload-artifact@v4
        with:
          name: eli-source
          retention-days: 3
          path: |
            dist/*.whl
            dist/eli_v3-*.tar.gz
            dist/*.deb
            dist/*windows-portable.zip
            dist/*windows-portable-full.zip
            dist/*windows-arm64-portable.zip
            dist/*wheelhouse*.tar.gz
            dist/WHEELHOUSE*.txt
            dist/RELEASE_NOTES.md
            dist/SHA256SUMS-source.txt
          if-no-files-found: error

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [guard, build-windows, build-macos, build-linux, build-source-artifacts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge checksums
        run: |
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          ls -lh

      - name: Create/update GitHub Release and upload artifacts
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          name: ELI v${{ needs.guard.outputs.version }}
          # the notes above GitHub's list of changes: they say where the GPL sources are
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.whl
            dist/*.deb
            dist/WHEELHOUSE*.txt
            dist/RELEASE_NOTES.md
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

      # softprops uploads all ~11GB of assets in parallel, and that
      # consistently loses one or more of the multi-GB files to
      # "Error saving asset" (uploads.github.com choking under concurrent
      # huge-file PUTs from a single runner) while the small text/wheel/deb
      # files upload fine. Rather than rerun the whole job (which burns the
      # full build matrix again), find whatever didn't make it onto the
      # release and re-upload just that, one file at a time, with backoff.
      - name: Retry any assets the release step didn't finish uploading
        if: steps.publish.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          have="$(gh release view "$TAG" --json assets -q '.assets[].name')"
          cd dist
          shopt -s nullglob
          for f in *.zip *.exe *.dmg *.AppImage *.tar.gz *.whl *.deb WHEELHOUSE*.txt RELEASE_NOTES.md SHA256SUMS.txt; do
            if grep -qxF "$f" <<<"$have"; then
              echo "already uploaded: $f"
              continue
            fi
            echo "uploading missing asset: $f"
            attempt=1
            until gh release upload "$TAG" "$f" --clobber; do
              if [ "$attempt" -ge 4 ]; then
                echo "::error::failed to upload $f after $attempt attempts"
                exit 1
              fi
              echo "upload of $f failed (attempt $attempt), retrying in $((attempt * 20))s..."
              sleep $((attempt * 20))
              attempt=$((attempt + 1))
            done
          done
