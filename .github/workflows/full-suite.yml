name: full-suite

# The whole test suite, on one clean Linux runner. cross-platform-smoke runs a chosen set of test
# files on three systems; nothing ran the rest anywhere but the developer's machine, so a release
# could go out with a failing test nobody had run. This does not gate a release yet: it has to be
# seen passing on a runner first (a runner has no display, no speech voices, no model).
#
# Every pytest step MUST be `python -m pytest` (see cross-platform-smoke.yml for why).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '**/*.pdf', 'blueprints/**', 'docs/**']

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: every test · ubuntu · py3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      ELI_TEST_STRICT_ISOLATION: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      # The versions a release ships (release.yml): the lock and the llama-cpp-python the GPU packs
      # are built at. Without them the runner took the newest of everything, PySide6 6.12.0 among
      # them, which aborted the run at exit after every test had passed.
      PIP_CONSTRAINT: ${{github.workspace}}/packaging/llama_cpp_constraints.txt ${{github.workspace}}/.build-constraints/lock.txt
      # What a release ships: pyproject's dependencies (everything ELI needs to run its features) and
      # the extras release.yml's Linux build bundles. This installed a hand-picked set of extras that left
      # out voice input and output, so test_stt_noise_self_heal.py ran without SpeechRecognition.
      # tests/claims/test_runtime_dependencies.py holds these to release.yml's.
      REQUIRED_EXTRAS: "llm"
      OPTIONAL_EXTRAS: "image"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Constraints from the lock (pip reads them through PIP_CONSTRAINT)
        run: python packaging/lock_constraints.py .build-constraints/lock.txt

      - name: System libraries Qt needs with no display, and PortAudio's headers for PyAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            portaudio19-dev

      - name: Install (what a release ships, and the tests' drivers; CPU only)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # the CPU build of PyTorch first, as the release's Linux build does: an extra that needs it
          # would otherwise take PyPI's CUDA build
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          llama_src="$(python packaging/llama_source.py)"
          pip install "$llama_src"
          pip install -e ".[$(echo $REQUIRED_EXTRAS test | tr ' ' ',')]"
          for extra in $OPTIONAL_EXTRAS; do
            pip install -e ".[$extra]" \
              || echo "::warning::optional extra '$extra' does not install on this runner; the release's Linux build skips it the same way"
          done

      - name: Leave out the GPL packages PyAutoGUI declares, as every release build does
        run: python packaging/gpl_sources.py --leave-out

      - name: Every test
        run: |
          python -m pytest -p no:cacheprovider -o addopts="" -q --strict-markers \
            --continue-on-collection-errors -rf tests
