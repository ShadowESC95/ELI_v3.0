[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-v3"
version = "3.0.172"
description = "ELI v3 — Local cognitive runtime, assistant GUI, memory, tools, and GGUF inference"
readme = "README.md"
requires-python = ">=3.10"
# Proprietary commercial software: licensed only under the ELI End User Licence
# Agreement (COMMERCIAL_EULA.md). See LICENSE. All rights reserved.
license = "LicenseRef-ELI-EULA"
authors = [{ name = "Jason Fitzgibbon Bridgeman", email = "jaybridgeman0095@gmail.com" }]
keywords = ["ai", "assistant", "llm", "local", "gpu", "gguf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: X11 Applications :: Qt",
]
# Everything ELI needs to run its features, on every system: a plain `pip install` of the project gives
# voice input and output, the window, the server, documents, vision, web search, wake words and the
# device drivers. An optional extra once held each of these, and what a user got depended on which
# extras the way they installed asked for (the full suite's workflow asked for none of the voice ones).
# Only what cannot be installed the same way everywhere stays optional, below.
# tests/claims/test_runtime_dependencies.py holds every package eli/ and api/ import to this list.
dependencies = [
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.28",
    "Pillow>=10.0",
    "mss>=9.0",
    # Keyboard and mouse where no native tool does. PyAutoGUI declares MouseInfo, PyMsgBox and python3-xlib,
    # which are under the GPL: no release carries them (packaging/gpl_sources.py, LEFT_OUT), and its X11
    # backend drives python-xlib's Xlib (LGPL) instead.
    "PyAutoGUI>=0.9.54",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pyttsx3>=2.9",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "psutil>=5.9",
    "tqdm>=4.64",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.24,<2.5",  # numba (coqui-tts -> librosa) rejects NumPy 2.5
    "faiss-cpu>=1.7",
    "Jinja2>=3.1",        # the model's chat template (eli/cognition/chat_template.py)
    "comtypes>=1.2; sys_platform == 'win32'",
    "pycaw; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",   # Start-menu shortcuts (eli/runtime/desktop_launchers.py)
    "tomli>=2.0.1; python_version<'3.11'",
    # Window. GUI binding policy:
    #   PySide6 is the canonical Qt binding for ELI. It is licensed LGPLv3,
    #   which permits dynamic linking from proprietary or differently-licensed
    #   code (Python always loads C extensions dynamically), so the binding
    #   itself does not impose copyleft on the rest of this project.
    #
    #   PyQt6 is intentionally NOT a dependency here. PyQt6 is GPLv3 and would
    #   force the entire shipped binary to be GPL, blocking proprietary
    #   distribution. The runtime shim at eli/gui/qt_compat.py allows users
    #   who already have PyQt6/PyQt5 installed to run from source, but the
    #   packaged distribution must remain PySide6-only to honour the
    #   project license declared above.
    # 6.12.0 loses a reference to None on every Qt call on Python 3.11 and earlier, which aborts the
    # app ("deallocating None"); eli/core/singleton_refs.py guards it, builds should not ship it.
    "PySide6>=6.5,!=6.12.0; python_version < '3.12'",
    "PySide6>=6.5; python_version >= '3.12'",
    # Voice output: Kokoro-82M through onnxruntime (eli/perception/tts_kokoro.py). misaki turns text into
    # Kokoro's phonemes; it is declared WITHOUT its [en] extra, which brings espeak-ng (GPL) through
    # espeakng-loader and phonemizer-fork. Its English needs spaCy (the tagger; the en_core_web_sm 3.8.0
    # fetched with the voice needs spaCy 3.8) and num2words (LGPL-2.1, numbers as words), declared here;
    # python-crfsuite runs the guess for words its dictionaries lack; it has no build for Windows on ARM,
    # where those words are spelt instead (tts_kokoro.available does not need it).
    "onnxruntime>=1.15",
    "misaki>=0.9.4,<0.10",
    "spacy>=3.8,<3.9",
    "num2words>=0.5",
    "python-crfsuite>=0.9; platform_machine != 'ARM64'",
    # Speaking the reply's language (eli/perception/reply_language.py): langdetect names a Latin-script
    # reply's language; misaki's Chinese G2P (jieba, pypinyin, cn2an, ordered-set) gives Kokoro's Mandarin
    # voices their phonemes without espeak-ng. All MIT or Apache-2.0, pure Python.
    "langdetect>=1.0.9",
    "jieba>=0.42",
    "pypinyin>=0.50",
    "cn2an>=0.5",
    "ordered-set>=4.1",
    # Voice input. PyAudio has ready-made builds for Windows only; on Linux and macOS it is compiled
    # against PortAudio's headers (portaudio19-dev, portaudio-devel, `brew install portaudio`), which
    # install.sh adds first.
    "faster-whisper>=1.0",
    "SpeechRecognition>=3.10",
    "PyAudio>=0.2",
    # audioop left the stdlib in 3.13 (PEP 594) and ELI's mic path imports it;
    # on 3.13+ distros it previously arrived only as a transitive dep.
    'audioop-lts>=0.2.1; python_version >= "3.13"',
    # Wake word
    "openwakeword>=0.4",
    # Documents and reports
    "markdown>=3.5",
    "pdfplumber>=0.10",
    "pypdf>=4.0",
    "python-docx>=1.1",
    # Self-hosted REST + web chat UI (api/server.py) — the phone/web-app feature — and the device server.
    "fastapi>=0.110",
    "starlette>=0.36",
    "uvicorn>=0.27",
    "websockets>=14.0",   # pinned explicitly — see requirements.txt for why
    "paho-mqtt>=1.6,<3",  # ELI-native MQTT device server (no Home Assistant)
    "zeroconf>=0.70",     # mDNS device/broker discovery
    "bleak>=0.21",        # Bluetooth (BLE) device discovery (degrades cleanly if no radio)
    "dbus-fast>=2.0; sys_platform == 'linux'",  # the desktop's media players and notifications over D-Bus
    "segno>=1.5",         # QR codes for Connect tab / phone pairing
    "cryptography>=41",   # self-signed LAN HTTPS cert (phone microphone)
    # Device drivers for what does not speak MQTT (eli/runtime/device_drivers.py). The dashboard's
    # one-click install runs pip, which a packaged app does not have, so they ship with ELI.
    "pychromecast>=13.0",     # Chromecast
    "androidtv[async]>=0.0.70",  # Fire TV / Android TV
    "adb-shell>=0.4",         # Fire TV / Android TV pairing keys
    "pyatv>=0.16",            # Apple TV / AirPlay (0.16 read tags with tinytag, not the GPL's mutagen)
    # Gaze cursor + on-screen OCR.
    "opencv-python>=4.8",
    "pytesseract>=0.3",
    # Web search + browser automation plugins.
    "ddgs>=9.0",
    "playwright>=1.40",
    # Data/CSV analysis + plotting + 3D mesh inspection.
    "pandas>=2.0",
    "matplotlib>=3.7",
    "meshio>=5.3",
    # HF downloads, desktop notifications, calendar, code lint.
    "huggingface-hub>=0.20",
    "plyer>=2.1",
    "ics>=0.7",
    "pyflakes>=3.0",
    # Direct playback of a video's sound through mpv; without it playback is browser-only.
    "yt-dlp>=2025.1",
    # The plugin scanner's YARA engine (it runs the user's own ruleset). No build for Python 3.14 yet,
    # and from source it needs a compiler and OpenSSL's headers.
    'yara-python>=4.5; python_version < "3.14"',
]

[project.optional-dependencies]
# Only what cannot be installed the same way on every machine: each is built for, or chosen by, the
# machine's GPU, and the installers fetch it by a step of their own.
# The inference engine. PyPI has no ready-made build: the installers build it for the GPU they find
# (CUDA, Metal, ROCm, Vulkan or CPU), at the version packaging/llama_cpp_constraints.txt holds.
llm = [
    "llama-cpp-python>=0.2",
]
# Image generation. accelerate needs PyTorch, which the installers take from the index for this GPU.
image = [
    "diffusers>=0.20",
    "safetensors>=0.3",
    "accelerate>=0.20",
]
# Test-suite drivers (API subprocess tests, lint gates, MQTT probe). Cross-platform.
# Keep in sync with requirements-test.txt.
test = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=14.0",   # pinned explicitly — see requirements.txt for why
    "httpx>=0.27",
    "paho-mqtt>=1.6,<3",
    "pyflakes>=3.0",
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "cryptography>=41",
    "python-multipart>=0.0.9",
    "starlette>=0.36",
]
# Everything ELI uses at runtime — the one-click "complete" install.
full = [
    "eli-v3[llm,image]",
]
# The GPU voice, Qwen3-TTS (Apache-2.0), is not an extra: qwen-tts needs transformers 4.57.3 and
# accelerate 1.12.0, older than this environment's, so ELI makes it a runtime of its own on a machine whose
# GPU has room for it (eli/perception/qwen3_runtime.py, eli/perception/qwen3_runtime.txt).
# Neural voice cloning — Chatterbox (Resemble AI, MIT-licensed code + weights).
# Commercial-clean replacement for XTTS (Coqui's model licence is non-commercial):
# zero-shot cloning from a short reference clip + native emotion/exaggeration control.
# Heavy (pulls torch), opt-in — NOT part of `full`; downloads a model on first use.
# Powers clone:<name> voices; the record/upload flow feeds it via the shared registry.
chatterbox = [
    "chatterbox-tts>=0.1",
    "torch>=2.0",
    "torchaudio>=2.0",
]
# LoRA fine-tuning (heavy, opt-in — NOT part of full). See training/README.md.
training = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.18",
    "trl>=0.8",
    # 4-bit (QLoRA) lets a card too small for fp16 weights still train the adapter. NVIDIA on Linux
    # and Windows only: there is no macOS build, and the trainer falls back to fp16 without it.
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
]

[project.urls]
Homepage = "https://github.com/ShadowESC95/ELI_v3.0"
Repository = "https://github.com/ShadowESC95/ELI_v3.0"

[project.scripts]
# eli/__main__.py reads every option (the licence flags, --license, --mcp-server, --mcp-config,
# --trust-agent, --bundles, --bundle, --headless) and otherwise starts the window; pointed at the window
# itself, these commands ignored all but --setup, --choose and --no-bundles.
eli = "eli.__main__:console_main"
"eli-v3" = "eli.__main__:console_main"
eli-cli = "eli.__main__:console_main"
eli-mcp = "eli.integrations.mcp.server:main"
eli-jobs = "eli.planning.jobqueue_cli:main"
eli-license = "eli.licensing.cli:main"

[project.gui-scripts]
eli-gui = "eli.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eli*"]
exclude = ["tests*", "ops*", "build*"]

[tool.setuptools.package-data]
"eli" = [
    "**/*.json",
    "**/*.yaml",
    "**/*.yml",
    "**/*.txt",
    "**/*.toml",
    "**/*.cfg",
    "**/*.md",
    "tools/image_engine/presets/*.json",
    "tools/image_engine/config/*.json",
    "plugins/registry/*.json",
    "cognition/persona*.txt",
    "licensing/keys/*.pub",
    "licensing/keys/*.md",
]

# Never let dev-tooling / dot-directories (.claude, .git, caches) get hoovered into the
# wheel by the broad **/*.json globs above — that leaked local paths/usernames once.
[tool.setuptools.exclude-package-data]
"eli" = [
    ".claude/*", "**/.claude/*",
    ".git/*", "**/.git/*",
    "**/.*/**",
    "**/__pycache__/*",
]
