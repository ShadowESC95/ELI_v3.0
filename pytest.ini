[pytest]
# ── ELI MKXI Test Configuration ──────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show each test name and outcome
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# An unregistered marker is an error. pytest 7/8 take that from --strict-markers above;
# pytest 9 reads ini overrides before it reads addopts, so there the flag above does
# nothing and only this key turns it on.
strict_markers = true

# Custom markers
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    gpu: tests requiring a real GPU / model file
    gui: tests requiring PyQt6 display (set DISPLAY or run headless)
    integration: cross-layer integration tests
    timeout: marks tests that use pytest-timeout (requires pytest-timeout plugin)
    launches_apps: the test starts a real, harmless program, so tests/conftest.py leaves the app launchers unstubbed

# Minimum pytest version
minversion = 7.0

# Timeout (requires pytest-timeout)
# timeout = 30
